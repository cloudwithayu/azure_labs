<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseHome Pro - Smart IoT Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#05070f] text-slate-100 min-h-screen selection:bg-cyan-500 selection:text-white" x-data="iotApp()" x-init="initData()">

    <!-- Header -->
    <header class="border-b border-slate-800/80 bg-[#05070f]/80 backdrop-blur-md sticky top-0 z-50 px-6 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 via-indigo-600 to-purple-600 flex items-center justify-center shadow-lg shadow-cyan-500/20 text-xl">⚡</div>
            <div>
                <span class="text-lg font-extrabold bg-gradient-to-r from-cyan-400 via-sky-300 to-indigo-400 bg-clip-text text-transparent">PulseHome Pro</span>
                <span class="block text-[10px] text-slate-400 uppercase tracking-widest font-semibold">Node.js IoT Control Mesh</span>
            </div>
        </div>
        <button @click="showAddModal = true" class="px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-cyan-500/20 transition-all">
            + Add Device
        </button>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- Automation Scenes Banner -->
        <div class="bg-gradient-to-r from-blue-900/40 via-indigo-900/40 to-purple-900/40 border border-blue-500/20 p-6 rounded-3xl flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
                <span class="text-xs font-bold text-cyan-400 uppercase tracking-wider bg-cyan-500/10 px-2.5 py-1 rounded border border-cyan-500/20">Quick Automation Macros</span>
                <h3 class="text-xl font-bold text-white mt-2">Instant Environmental Control Scenes</h3>
            </div>
            <div class="flex space-x-3">
                <button @click="activateScene('away')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold text-xs rounded-xl transition-all">
                    🔒 Away Mode
                </button>
                <button @click="activateScene('party')" class="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-cyan-500/25 transition-all">
                    🎉 Party Mode
                </button>
            </div>
        </div>

        <!-- Room Filter Tabs -->
        <div class="flex space-x-2 overflow-x-auto pb-2">
            <template x-for="room in ['All Rooms', 'Living Room', 'Kitchen', 'Exterior']" :key="room">
                <button @click="selectedRoom = room" 
                        :class="selectedRoom === room ? 'bg-cyan-500 text-slate-950 font-bold shadow-lg shadow-cyan-500/20' : 'bg-slate-900 text-slate-400 border border-slate-800 hover:text-white'"
                        class="px-5 py-2 rounded-xl text-xs transition-all whitespace-nowrap" x-text="room">
                </button>
            </template>
        </div>

        <!-- Devices Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="device in getFilteredDevices()" :key="device.id">
                <div class="bg-slate-900/90 border border-slate-800/80 rounded-3xl p-6 flex flex-col justify-between shadow-xl hover:border-slate-700 transition-all group">
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-12 h-12 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center text-2xl shadow-inner" x-text="device.icon"></div>
                            
                            <!-- Toggle Button -->
                            <button @click="toggleDevice(device.id)" 
                                    :class="device.state ? 'bg-cyan-500 shadow-lg shadow-cyan-500/30' : 'bg-slate-800 border border-slate-700'"
                                    class="w-14 h-8 flex items-center rounded-full p-1 transition-all duration-300 cursor-pointer">
                                <div :class="device.state ? 'translate-x-6 bg-slate-950' : 'translate-x-0 bg-slate-400'"
                                     class="w-6 h-6 rounded-full shadow-md transform transition-transform duration-300"></div>
                            </button>
                        </div>

                        <span class="text-[10px] uppercase tracking-wider font-semibold text-slate-500" x-text="device.room"></span>
                        <h4 class="text-lg font-bold text-white mb-2 group-hover:text-cyan-400 transition-colors" x-text="device.name"></h4>

                        <!-- Interactive Slider Control for Numeric Values -->
                        <template x-if="typeof device.value === 'number'">
                            <div class="space-y-1.5 my-4 bg-slate-950/60 p-3 rounded-2xl border border-slate-800/80">
                                <div class="flex justify-between text-xs font-mono">
                                    <span class="text-slate-400">Level / Output:</span>
                                    <span class="text-cyan-400 font-bold" x-text="device.value + device.unit"></span>
                                </div>
                                <input type="range" min="0" max="100" x-model.number="device.value" @change="updateValue(device.id, device.value)" class="w-full accent-cyan-400 cursor-pointer">
                            </div>
                        </template>

                        <template x-if="typeof device.value === 'string'">
                            <p class="text-xs font-mono mb-4" :class="device.color" x-text="device.value"></p>
                        </template>
                    </div>

                    <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs">
                        <span class="text-slate-500 uppercase tracking-wider font-semibold">Node Status</span>
                        <span class="font-bold px-2.5 py-1 rounded-full uppercase"
                              :class="device.state ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-slate-800 text-slate-400'"
                              x-text="device.state ? 'Active' : 'Standby'"></span>
                    </div>
                </div>
            </template>
        </div>

        <!-- Telemetry Log Stream -->
        <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 shadow-xl">
            <h3 class="text-lg font-bold text-white mb-4">MQTT Telemetry & Automation Stream</h3>
            <div class="bg-slate-950 border border-slate-800/80 rounded-2xl p-4 font-mono text-xs space-y-2 max-h-40 overflow-y-auto">
                <template x-for="log in logs" :key="log.time + log.event">
                    <div class="flex items-center space-x-3 text-slate-300">
                        <span class="text-cyan-400 font-semibold" x-text="'[' + log.time + ']'"></span>
                        <span x-text="log.event"></span>
                    </div>
                </template>
            </div>
        </div>

    </main>

    <!-- Modal: Add New Device -->
    <div x-show="showAddModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4" style="display: none;">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl">
            <h3 class="text-xl font-bold text-white mb-2">Register IoT Peripheral</h3>
            <p class="text-slate-400 text-xs mb-4">Connect a new hardware sensor or actuator node to the backend.</p>
            
            <form @submit.prevent="addDevice" class="space-y-4 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1 font-semibold">Device Name</label>
                    <input type="text" x-model="newDeviceForm.name" required placeholder="e.g., Garage Smart Light" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1 font-semibold">Assigned Room</label>
                    <select x-model="newDeviceForm.room" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 outline-none focus:border-cyan-500">
                        <option>Living Room</option>
                        <option>Kitchen</option>
                        <option>Exterior</option>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1 font-semibold">Device Icon Emoji</label>
                    <input type="text" x-model="newDeviceForm.icon" value="💡" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 outline-none focus:border-cyan-500">
                </div>
                <div class="flex space-x-3 pt-2">
                    <button type="button" @click="showAddModal = false" class="flex-1 py-2.5 bg-slate-800 text-slate-300 font-semibold rounded-xl">Cancel</button>
                    <button type="submit" class="flex-1 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-cyan-500/25">Register</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Frontend Script Engine -->
    <script>
        function iotApp() {
            return {
                devices: [],
                logs: [],
                selectedRoom: 'All Rooms',
                showAddModal: false,
                newDeviceForm: { name: '', room: 'Living Room', icon: '💡', unit: '%' },
                async initData() {
                    await this.fetchDevices();
                    await this.fetchLogs();
                },
                async fetchDevices() {
                    const res = await fetch('/api/devices');
                    this.devices = await res.json();
                },
                async fetchLogs() {
                    const res = await fetch('/api/logs');
                    this.logs = await res.json();
                },
                getFilteredDevices() {
                    if (this.selectedRoom === 'All Rooms') {
                        return this.devices;
                    }
                    return this.devices.filter(d => d.room === this.selectedRoom);
                },
                async toggleDevice(id) {
                    const res = await fetch(`/api/devices/${id}/toggle`, { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        this.devices = this.devices.map(d => d.id === data.device.id ? data.device : d);
                        this.logs = data.logs;
                    }
                },
                async updateValue(id, value) {
                    const res = await fetch(`/api/devices/${id}/update`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ value })
                    });
                    const data = await res.json();
                    if (data.success) this.logs = data.logs;
                },
                async activateScene(mode) {
                    const res = await fetch(`/api/scenes/${mode}`, { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        this.fetchDevices();
                        this.logs = data.logs;
                    }
                },
                async addDevice() {
                    const res = await fetch('/api/devices', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.newDeviceForm)
                    });
                    const data = await res.json();
                    if (data.success) {
                        this.devices = data.devices;
                        this.logs = data.logs;
                        this.showAddModal = false;
                        this.newDeviceForm.name = '';
                    }
                }
            }
        }
    </script>
</body>
</html>
